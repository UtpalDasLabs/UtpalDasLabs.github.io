# Pages CMS schema — https://pagescms.org
# Edit this site's content at https://app.pagescms.org (sign in with GitHub).
# Every save commits to this repo; the GitHub Pages workflow redeploys in ~2 min.

media:
  input: public
  output: /

content:
  - name: site
    label: Site & Hero Copy
    type: file
    path: content/site.json
    fields:
      - { name: heroFirstName, label: Hero first name, type: string }
      - { name: heroLastName, label: Hero last name (accent color), type: string }
      - { name: tagline, label: Tagline strip, type: string }
      - { name: heroRole, label: Hero role line, type: string }
      - { name: heroBio, label: Hero bio, type: text }
      - { name: manifestoLead, label: Manifesto — line 1, type: string }
      - { name: manifestoMiddle, label: Manifesto — line 2 (muted), type: string }
      - { name: manifestoEnd, label: Manifesto — line 3, type: string }
      - { name: manifestoAccent, label: Manifesto — line 4 (accent), type: string }
      - { name: manifestoFootnote, label: Manifesto footnote, type: string }
      - { name: dreamLabel, label: Dream panel — label, type: string }
      - { name: dreamLine, label: Dream panel — line, type: text }
      - { name: dreamAccent, label: Dream panel — accent line, type: string }
      - name: pillars
        label: Philosophy pillars (About page)
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: note, label: Note, type: text }
      - { name: signatureQuotes, label: Signature quotes, type: string, list: true }
      - { name: contactEmail, label: Contact email, type: string }
      - { name: linkedin, label: LinkedIn URL, type: string }
      - { name: github, label: GitHub URL, type: string }
      - { name: location, label: Location, type: string }

  - name: home
    label: Homepage (Evidence Engine)
    type: file
    path: content/home.json
    fields:
      - name: hero
        label: Hero
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: headline, label: Headline, type: string }
          - { name: subPositioning, label: Sub-positioning, type: string }
          - { name: roleBadge, label: Role badge, type: string }
          - { name: body, label: Body, type: text }
          - { name: proofPills, label: Proof pills, type: string, list: true }
          - { name: primaryCta, label: Primary button, type: string }
          - { name: secondaryCta, label: Secondary button, type: string }
          - { name: ghostCta, label: Labs link (count is added automatically), type: string }
      - name: manifesto
        label: Manifesto
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: lead, label: Line 1, type: string }
          - { name: middle, label: Line 2 (muted), type: string }
          - { name: accent, label: Line 3 (amber), type: string }
      - name: thesis
        label: The next dream + blueprint
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: headline, label: Headline, type: text }
          - { name: headlineAccent, label: Headline accent, type: string }
          - { name: lead, label: Lead, type: text }
          - { name: trigger, label: Drawer button, type: string }
          - { name: blueprintTitle, label: Blueprint title, type: string }
          - { name: premiseTitle, label: Premise title, type: string }
          - { name: premise, label: Premise paragraphs, type: text, list: true }
          - { name: pipelineTitle, label: Pipeline title, type: string }
          - name: stages
            label: Stages
            type: object
            list: true
            fields:
              - { name: index, label: Index, type: string }
              - { name: name, label: Name, type: string }
              - { name: mode, label: Mode, type: string }
              - { name: body, label: Body, type: text }
          - { name: noteLink, label: Link to the note, type: string }
      - name: projects
        label: Flagship case studies
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: title, label: Title, type: string }
          - { name: lead, label: Lead, type: text }
          - { name: archiveCta, label: Archive link, type: string }
          - name: caseStudies
            label: Case studies
            type: object
            list: true
            fields:
              - { name: id, label: ID, type: string }
              - { name: tag, label: Tag, type: string }
              - { name: meta, label: Meta line, type: string }
              - { name: headline, label: Headline, type: text }
              - name: matrix
                label: Constraint matrix
                type: object
                fields:
                  - { name: domain, label: System domain, type: text }
                  - { name: constraints, label: Hard constraints, type: text }
                  - { name: scope, label: Ownership & scope, type: text }
                  - { name: outcome, label: Verified outcome, type: text }
              - name: tradeoff
                label: Hard architectural tradeoff
                type: object
                fields:
                  - { name: context, label: Context, type: text }
                  - { name: decision, label: Decision, type: text }
                  - { name: result, label: Result, type: text }
              - { name: related, label: Related project IDs (deep-dive links), type: string, list: true }
      - name: labs
        label: Shipped ecosystems (Labs)
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: title, label: Title, type: string }
          - { name: lead, label: Lead, type: text }
          - { name: allLabsCta, label: Labs page link, type: string }
          - name: teardowns
            label: Apps
            type: object
            list: true
            fields:
              - { name: id, label: ID, type: string }
              - { name: name, label: Name, type: string }
              - { name: kind, label: Kind, type: string }
              - { name: status, label: Status badge, type: string }
              - { name: url, label: Live URL, type: string }
              - { name: repoUrl, label: Source URL (optional), type: string, required: false }
              - { name: summary, label: Summary, type: text }
              - name: points
                label: Tear-down points
                type: object
                list: true
                fields:
                  - { name: title, label: Title, type: string }
                  - { name: code, label: Code reference, type: string }
                  - { name: body, label: Body, type: text }
      - name: principles
        label: Principles & kind words
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: title, label: Title, type: string }
          - { name: allKindWordsCta, label: Kind Words link, type: string }
          - name: endorsements
            label: Endorsements (author must match Kind Words exactly)
            type: object
            list: true
            fields:
              - { name: standard, label: Standard it proves, type: string }
              - { name: author, label: Author, type: string }
      - name: contact
        label: Contact selector
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: title, label: Title, type: string }
          - { name: lead, label: Lead, type: text }
          - name: intents
            label: Paths
            type: object
            list: true
            fields:
              - { name: id, label: ID, type: string }
              - { name: label, label: Label, type: string }
              - { name: audience, label: Audience, type: string }
              - { name: summary, label: Summary, type: text }
              - { name: subject, label: Email subject, type: string }
              - { name: cta, label: Button, type: string }

  - name: projects
    label: Projects
    type: file
    path: content/projects.json
    list: false
    fields:
      - name: projects
        label: Project
        type: object
        list: true
        fields:
          - { name: id, label: URL slug (lowercase-hyphens), type: string }
          - { name: title, label: Title, type: string }
          - name: category
            label: Category
            type: select
            options:
              values:
                - AI Systems
                - Mobility & Marketplaces
                - Industrial & Vision
                - Avionics & Embedded
                - Leadership
          - { name: year, label: Year(s), type: string }
          - { name: tags, label: Tags, type: string, list: true }
          - { name: companies, label: Company keys (see companies.json), type: string, list: true }
          - { name: description, label: Description (shown on the Projects grid card), type: text }

          # ---- Case study (all optional) ----
          # Fill these in to upgrade a project from the compact layout to the
          # full case study. Leave them empty and the project renders as before.
          - { name: oneLiner, label: "Case study — one-line value proposition (under the hero)", type: text, required: false }
          - name: metrics
            label: "Case study — headline metrics (max 4, shown as big numbers)"
            type: object
            list: true
            required: false
            fields:
              - { name: value, label: "Value (e.g. +30%, 2×, 3,700+)", type: string }
              - { name: label, label: "Label (e.g. organic acquisition)", type: string }
              - { name: note, label: Small note underneath (optional), type: string, required: false }
          - { name: role, label: "Case study — my role", type: string, required: false }
          - { name: team, label: "Case study — team (e.g. 4 senior PMs · 24 engineers)", type: string, required: false }
          - { name: scale, label: "Case study — scale (e.g. 2M+ listings)", type: string, required: false }
          - { name: period, label: "Case study — precise period (e.g. Aug 2022 – Jan 2024)", type: string, required: false }
          - { name: stack, label: "Case study — stack / tools", type: string, list: true, required: false }
          - { name: problem, label: "Case study — the problem", type: text, required: false }
          - { name: approach, label: "Case study — what I built (one entry per bullet)", type: text, list: true, required: false }
          - { name: outcome, label: "Case study — the outcome", type: text, required: false }
          - { name: recommendationRef, label: "Case study — pull-quote: exact author name from Kind Words", type: string, required: false }

          - { name: story, label: The story (one entry per paragraph), type: text, list: true }
          - { name: link, label: External link (optional), type: string, required: false }
          - { name: coverImage, label: Cover image / SVG, type: image }
          - { name: coverVideo, label: Cover video (optional), type: file, required: false }
          - { name: coverPoster, label: Video poster frame (optional — extracted still, not the SVG), type: image, required: false }
          - { name: coverHeadline, label: Typographic cover — headline (only if no video), type: string, required: false }
          - { name: coverCaption, label: Typographic cover — caption, type: string, required: false }

  - name: labs
    label: Labs (free tools)
    type: file
    path: content/labs.json
    list: false
    fields:
      - name: intro
        label: Page intro
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow line, type: string }
          - { name: title, label: Title, type: string }
          - { name: lead, label: Lead paragraph, type: text }
          - { name: githubUrl, label: GitHub org URL, type: string }
      - name: tools
        label: Tool
        type: object
        list: true
        fields:
          - { name: id, label: ID (lowercase-hyphens), type: string }
          - { name: name, label: Tool name, type: string }
          - { name: tagline, label: Tagline (one line), type: string }
          - { name: description, label: Description, type: text }
          - { name: tags, label: Tags, type: string, list: true }
          - { name: url, label: "Live URL (required when status is live)", type: string, required: false }
          - name: status
            label: Status
            type: select
            options:
              values:
                - live
                - soon
          - { name: coverHeadline, label: Cover headline (big text), type: string }
          - { name: coverCaption, label: Cover caption (small text), type: string }

  - name: recommendations
    label: Recommendations (Kind Words)
    type: file
    path: content/recommendations.json
    list: false
    fields:
      - name: recommendations
        label: Recommendation
        type: object
        list: true
        fields:
          - { name: author, label: Author, type: string }
          - { name: role, label: Role & company, type: string }
          - { name: context, label: Context (how you worked together), type: string }
          - { name: company, label: Company (for filter), type: string }
          - { name: quote, label: Quote, type: text }
          - { name: featured, label: "Featured?", type: boolean }

  - name: profile
    label: Profile (Experience & Skills)
    type: file
    path: content/profile.json
    fields:
      - { name: headline, label: LinkedIn headline, type: text }
      - name: positions
        label: Positions
        type: object
        list: true
        fields:
          - { name: company, label: Company, type: string }
          - { name: title, label: Title, type: string }
          - { name: location, label: Location, type: string }
          - { name: start, label: Start (e.g. Feb 2024), type: string }
          - { name: end, label: End (blank = present), type: string, required: false }
          - { name: summary, label: Summary, type: text }
      - name: skillGroups
        label: Skill groups
        type: object
        list: true
        fields:
          - { name: label, label: Group label, type: string }
          - { name: skills, label: Skills, type: string, list: true }
      - name: topEndorsed
        label: Top endorsed skills
        type: object
        list: true
        fields:
          - { name: name, label: Skill, type: string }
          - { name: count, label: Endorsement count, type: number }
      - name: languages
        label: Languages
        type: object
        list: true
        fields:
          - { name: name, label: Language, type: string }
          - { name: level, label: Level, type: string }
      - name: education
        label: Education
        type: object
        list: true
        fields:
          - { name: school, label: School, type: string }
          - { name: degree, label: Degree, type: string }
          - { name: period, label: Period, type: string }
          - { name: activities, label: Activities, type: string, required: false }
      - name: certifications
        label: Certifications
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: authority, label: Authority, type: string }
          - { name: year, label: Year, type: string }
      - name: honors
        label: Honors
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: issued, label: Issued by / year, type: string }
      - name: volunteering
        label: Volunteering
        type: object
        list: true
        fields:
          - { name: org, label: Organisation, type: string }
          - { name: role, label: Role, type: string }
          - { name: cause, label: Cause, type: string }
          - { name: since, label: Since, type: string, required: false }

  - name: companies
    label: Companies (logos & links)
    type: file
    path: content/companies.json
    fields:
      - name: companies
        label: Company
        type: object
        list: true
        fields:
          - { name: key, label: Key (referenced by projects), type: string }
          - { name: name, label: Name, type: string }
          - { name: url, label: URL, type: string, required: false }
          - { name: logo, label: Logo, type: image, required: false }
